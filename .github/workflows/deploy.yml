name: Deploy to SiteGround

# Triggers:
#   - push to `develop` → deploys to STAGING
#   - push to `main`    → deploys to PRODUCTION (gated by branch protection + PR review)

on:
  push:
    branches:
      - main
      - develop
    # A change to the workflows alone is not a release: nothing under
    # .github reaches the server, so nothing needs deploying. The same goes
    # for the tour records under content/ — they reach the site through the
    # "Add a tour" button (import-tour.yml), not through rsync.
    paths-ignore:
      - '.github/**'
      - 'content/**'
  workflow_dispatch:    # allow manual trigger from Actions tab

concurrency:
  # Cancel any in-progress deploy for the same branch when a new push lands.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: rsync child theme → SiteGround
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine target environment
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "host=${{ secrets.SG_PROD_HOST }}"     >> $GITHUB_OUTPUT
            echo "user=${{ secrets.SG_PROD_USER }}"     >> $GITHUB_OUTPUT
            echo "port=${{ secrets.SG_PROD_PORT }}"     >> $GITHUB_OUTPUT
            echo "path=${{ secrets.SG_PROD_THEME_PATH }}" >> $GITHUB_OUTPUT
            echo "env=production" >> $GITHUB_OUTPUT
          else
            echo "host=${{ secrets.SG_STAGE_HOST }}"     >> $GITHUB_OUTPUT
            echo "user=${{ secrets.SG_STAGE_USER }}"     >> $GITHUB_OUTPUT
            echo "port=${{ secrets.SG_STAGE_PORT }}"     >> $GITHUB_OUTPUT
            echo "path=${{ secrets.SG_STAGE_THEME_PATH }}" >> $GITHUB_OUTPUT
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SG_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Every step below shares ONE multiplexed SSH connection:
          # SiteGround's firewall rate-limits repeated short sessions from
          # shared runner IPs (from main, #61/#63, reconciled at launch).
          mkdir -p ~/.ssh/cm
          # SiteGround's SSH endpoint intermittently drops keyscan connections.
          # Retry with backoff, and treat an empty result as a failure too
          # (keyscan can exit 0 with no keys).
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p ${{ steps.target.outputs.port }} -H ${{ steps.target.outputs.host }} > ~/.ssh/keyscan_out || true
            if [ -s ~/.ssh/keyscan_out ]; then
              cat ~/.ssh/keyscan_out >> ~/.ssh/known_hosts
              exit 0
            fi
            echo "ssh-keyscan attempt ${attempt}/5 returned no keys; retrying in $((attempt * 5))s…"
            sleep $((attempt * 5))
          done
          echo "::error::ssh-keyscan failed after 5 attempts — SiteGround SSH endpoint unreachable" >&2
          exit 1

      - name: Deploy child theme via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='node_modules' \
            --exclude='*.md' \
            --exclude='docs' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} -o ControlMaster=auto -o ControlPath=~/.ssh/cm/%r@%h-%p -o ControlPersist=180" \
            wp-content/themes/kadence-oomph-child/ \
            ${{ steps.target.outputs.user }}@${{ steps.target.outputs.host }}:${{ steps.target.outputs.path }}/

      - name: Deploy oomphtravel block theme via rsync
        run: |
          # The new theme (D41) ships alongside kadence-oomph-child until the
          # switch; inactive on the server, so deploying it changes nothing a
          # visitor sees. Path derived like the plugin's, no new secret.
          THEME2_PATH="${{ steps.target.outputs.path }}"
          THEME2_PATH="${THEME2_PATH/themes\/kadence-oomph-child/themes\/oomphtravel}"
          echo "Deploying oomphtravel theme to: $THEME2_PATH"
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='*.md' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} -o ControlMaster=auto -o ControlPath=~/.ssh/cm/%r@%h-%p -o ControlPersist=180" \
            wp-content/themes/oomphtravel/ \
            ${{ steps.target.outputs.user }}@${{ steps.target.outputs.host }}:$THEME2_PATH/

      - name: Deploy oomph-travel-core plugin via rsync
        run: |
          # Derive plugin path from theme path — same hosting layout, swap
          # /themes/kadence-oomph-child → /plugins/oomph-travel-core.
          # Avoids needing a separate secret for the plugin destination.
          PLUGIN_PATH="${{ steps.target.outputs.path }}"
          PLUGIN_PATH="${PLUGIN_PATH/themes\/kadence-oomph-child/plugins\/oomph-travel-core}"
          echo "Deploying plugin to: $PLUGIN_PATH"
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='node_modules' \
            --exclude='*.md' \
            --exclude='docs' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} -o ControlMaster=auto -o ControlPath=~/.ssh/cm/%r@%h-%p -o ControlPersist=180" \
            wp-content/plugins/oomph-travel-core/ \
            ${{ steps.target.outputs.user }}@${{ steps.target.outputs.host }}:$PLUGIN_PATH/

      # Staging only. Creates any missing Destination / Operator / Tour records
      # as drafts and the four ways-to-travel pages as published pages
      # (idempotent: existing records are never touched), so the pages built
      # in code have records behind them without anyone running WP-CLI by
      # hand. Eric publishes the drafts from wp-admin. Never runs on production.
      - name: Seed launch records on staging (WP-CLI via SSH)
        if: steps.target.outputs.env == 'staging'
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} \
            -o ControlMaster=auto -o ControlPath=~/.ssh/cm/%r@%h-%p -o ControlPersist=180 \
            ${{ steps.target.outputs.user }}@${{ steps.target.outputs.host }} \
            "cd ${{ steps.target.outputs.path }}/../../.. && wp oomph seed destinations && wp oomph seed operators && wp oomph seed tours && wp oomph seed pages"

      - name: Purge SiteGround cache (WP-CLI via SSH)
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ steps.target.outputs.port }} \
            -o ControlMaster=auto -o ControlPath=~/.ssh/cm/%r@%h-%p -o ControlPersist=180 \
            ${{ steps.target.outputs.user }}@${{ steps.target.outputs.host }} \
            "cd ${{ steps.target.outputs.path }}/../../.. && ( wp sg purge || echo 'SG Optimizer not active — skipping wp sg purge' ) && ( wp cache flush || echo 'wp cache flush failed — skipping' )"

      - name: Clean up SSH key
        if: always()
        run: |
          # Close the multiplexed master connection, then remove the key.
          ssh -o ControlPath=~/.ssh/cm/%r@%h-%p -O exit \
            -p ${{ steps.target.outputs.port }} \
            ${{ steps.target.outputs.user }}@${{ steps.target.outputs.host }} 2>/dev/null || true
          rm -f ~/.ssh/deploy_key

      - name: Summary
        run: |
          echo "### Deployed to ${{ steps.target.outputs.env }} :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Host:   \`${{ steps.target.outputs.host }}\`" >> $GITHUB_STEP_SUMMARY

# ─────────────────────────────────────────────────────────────────────────
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#
#   SG_SSH_PRIVATE_KEY     The private half of the deploy keypair.
#                          Add the public half to SiteGround Site Tools →
#                          Devs → SSH Keys Manager.
#
#   SG_PROD_HOST           Production SSH host (e.g., us31.siteground.us)
#   SG_PROD_USER           Production SSH username
#   SG_PROD_PORT           Production SSH port (usually 18765)
#   SG_PROD_THEME_PATH     Absolute path to child theme on prod
#                          (e.g., /home/customer/www/oomphtravel.com/public_html/wp-content/themes/kadence-oomph-child)
#
#   SG_STAGE_HOST          Staging SSH host
#   SG_STAGE_USER          Staging SSH username
#   SG_STAGE_PORT          Staging SSH port
#   SG_STAGE_THEME_PATH    Absolute path to child theme on staging
#
# Branch protection rule (Settings → Branches → main):
#   - Require pull request before merging
#   - Require status checks to pass before merging
#   - Require linear history
#   - Restrict who can push to matching branches
# ─────────────────────────────────────────────────────────────────────────
