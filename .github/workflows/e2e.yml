name: E2E smoke (staging)

# Independent, NON-BLOCKING suite — it is not a required status check, so it
# never gates a deploy or a merge. Targets:
#   - after a main "Deploy to SiteGround" run (a release) → STAGING copy of
#     the suite, on demand — see the if: below (Eric, 2026-09-11: milestones
#     only, not after every develop merge)
#   - nightly on a schedule                          → PRODUCTION (reliable
#     canary; prod has no bot-wall issues from datacenter IPs)
#   - on demand from the Actions tab                 → pick staging/production
#
# Tests never submit a form (see docs/testing.md), so runs create no leads —
# safe against production.

on:
  workflow_run:
    workflows: ["Deploy to SiteGround"]
    types: [completed]
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC nightly
  workflow_dispatch:
    inputs:
      target:
        description: "Site to test"
        type: choice
        options: [staging, production]
        default: staging

# Key the group on trigger + target so a staging run and a production run can
# coexist; only same-kind runs supersede each other.
concurrency:
  group: e2e-${{ github.event_name }}-${{ inputs.target || 'auto' }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright against staging
    # Residential self-hosted runner, matching the CruiseOomph repo.
    # SiteGround's edge anti-bot layer answers GitHub's datacenter IPs with an
    # HTTP 202 JavaScript challenge instead of the page — 30 of them in run
    # 34512406670, on pages that serve 200 from any home connection. A home IP
    # is served like any visitor. If the runner is offline the job queues
    # rather than failing, and ci.yml still covers the theme and plugin on
    # GitHub's own machines.
    runs-on: [self-hosted, Windows, residential]

    # cmd, not bash and not PowerShell. Git Bash is not on this runner's PATH
    # (`bash: command not found`, run 34520815949) and the PC's execution
    # policy blocks the PowerShell wrapper the runner generates per step. cmd
    # is always there — the same choice the CruiseOomph workflow documents.
    # Every run: block below is a plain command, so cmd is enough.
    defaults:
      run:
        shell: cmd

    # For workflow_run triggers, only run after a SUCCESSFUL main deploy (a
    # milestone); develop deploys no longer trigger it.
    # schedule/workflow_dispatch have no workflow_run payload, so allow those.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')

    steps:
      # Which site to test, and which commit's TESTS to run against it. Both
      # are expressions rather than shell, so getting them right does not
      # depend on which shells this PC happens to have.
      #
      # A workflow_run checkout otherwise takes the repository's default
      # branch, which had this suite running main's specs against a staging
      # site built from develop.
      #
      #   after a develop deploy  ->  staging, at the exact commit deployed
      #   manual, staging         ->  staging, develop
      #   manual, production      ->  production, main
      #   nightly schedule        ->  production, main
      - name: Show the target
        run: echo Testing ${{ (github.event_name == 'schedule' || inputs.target == 'production') && 'https://oomphtravel.com' || 'https://staging2.oomphtravel.com' }} with the specs at ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'schedule' || inputs.target == 'production') && 'main' || 'develop' }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'schedule' || inputs.target == 'production') && 'main' || 'develop' }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        # No --with-deps: that installs Linux OS packages and has nothing to
        # do on Windows.
        run: npx playwright install chromium

      - name: Run e2e smoke tests
        run: npx playwright test
        env:
          OOMPH_BASE_URL: ${{ (github.event_name == 'schedule' || inputs.target == 'production') && 'https://oomphtravel.com' || 'https://staging2.oomphtravel.com' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
